name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Voicemeeter plugin
        uses: actions/checkout@v7
        with:
          path: streamdock-voicemeeter

      - name: Checkout StreamDockSDK
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.STREAMDOCK_SDK_REPOSITORY || 'vnoiram/StreamDockSDK' }}
          ref: ${{ vars.STREAMDOCK_SDK_REF || 'master' }}
          path: StreamDockSDK

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check JS and manifest
        working-directory: streamdock-voicemeeter
        run: npm run check

      - name: Build plugin (Linux Docker verification path)
        working-directory: streamdock-voicemeeter
        run: npm run release:zip:linux
